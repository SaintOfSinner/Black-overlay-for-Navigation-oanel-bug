name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q StripBawah.zip
      - run: cp app/src/main/java/com/example/bottomstrip/OverlayService.kt StripBawah/app/src/main/java/com/example/bottomstrip/OverlayService.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon -p StripBawah
      - uses: actions/upload-artifact@v4
        with:
          name: strip-bawah-apk
          path: StripBawah/app/build/outputs/apk/debug/app-debug.apk
